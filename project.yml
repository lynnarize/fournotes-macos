name: FourNotes
options:
  bundleIdPrefix: com.fournotes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  FourNotes:
    type: application
    platform: macOS
    sources:
      - path: FourNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fournotes.mac
        # The bundle and executable are FourNotes (no space, so paths and
        # TEST_HOST resolve cleanly); the user-visible name is set in
        # Info.plist via CFBundleName / CFBundleDisplayName.
        PRODUCT_NAME: FourNotes
        INFOPLIST_FILE: FourNotes/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: FourNotes/Resources/FourNotes.entitlements

  FourNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FourNotesTests
    dependencies:
      - target: FourNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fournotes.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FourNotes:
    build:
      targets:
        FourNotes: all
        FourNotesTests: [test]
    test:
      targets:
        - FourNotesTests
      gatherCoverageData: true
    run:
      config: Debug
