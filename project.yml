name: FourNotes
options:
  bundleIdPrefix: com.fournotes
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Speech on this Mac (Settings → AI & API keys → Speech models): Whisper to
# transcribe recordings, SpeakerKit to tell who said what. Open source (MIT), by
# Argmax. The models themselves are downloaded inside the app, not bundled.
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  FourNotes:
    type: application
    platform: macOS
    sources:
      - path: FourNotes
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fournotes.mac
        # The bundle and executable are FourNotes (no space, so paths and
        # TEST_HOST resolve cleanly); the user-visible name is set in
        # Info.plist via CFBundleName / CFBundleDisplayName.
        PRODUCT_NAME: FourNotes
        INFOPLIST_FILE: FourNotes/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: FourNotes/Resources/FourNotes.entitlements
        # The stamp script below reads .git and writes the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Google Drive sync: the client ID of an "iOS" OAuth client in the
        # same Google Cloud project as the web app's client. Not a secret —
        # an installed app's client ID ships inside it. Empty hides sync.
        GOOGLE_CLIENT_ID: "519024133947-v17jhel8ru064jbrfojktte9t2bogbv1.apps.googleusercontent.com"
    postBuildScripts:
      # Every build says which commit it is: CFBundleVersion becomes the commit
      # count (always rising on main) and FNGitCommit the short hash, "-dirty"
      # with uncommitted changes. Settings → About shows both. Runs before
      # signing, so the signature covers the stamped plist.
      - name: Stamp build number and commit
        basedOnDependencyAnalysis: false
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if ! git -C "$SRCROOT" rev-parse --git-dir >/dev/null 2>&1; then exit 0; fi
          BUILD=$(git -C "$SRCROOT" rev-list --count HEAD)
          COMMIT=$(git -C "$SRCROOT" rev-parse --short HEAD)
          git -C "$SRCROOT" diff --quiet HEAD -- || COMMIT="$COMMIT-dirty"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :FNGitCommit" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :FNGitCommit string $COMMIT" "$PLIST"

  FourNotesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FourNotesTests
    dependencies:
      - target: FourNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fournotes.mac.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FourNotes:
    build:
      targets:
        FourNotes: all
        FourNotesTests: [test]
    test:
      targets:
        - FourNotesTests
      gatherCoverageData: true
    run:
      config: Debug
